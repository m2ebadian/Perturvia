name: Backend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: perturvia
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: perturvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perturvia -d perturvia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Check linting
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://perturvia:test-password@localhost:5432/perturvia_test
        run: uv run --locked python -m pytest -v
