[project]
name = "perturvia-api"
version = "0.1.0"
description = "Backend API for the Perturvia AI agent reliability platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
